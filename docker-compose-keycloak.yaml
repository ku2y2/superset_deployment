version: '3.8'

services:
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: keycloak
    environment:
      # Admin credentials
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      # Database configuration (using embedded H2 for simplicity)
      KC_DB: dev-file

      # HTTP configuration
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8090"
      KC_HOSTNAME: "localhost"
      KC_HOSTNAME_PORT: "8090"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_RELATIVE_PATH: "/"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"

    ports:
      - "8090:8090"

    command:
      - start-dev
      - --http-port=8090

    volumes:
      - keycloak-data:/opt/keycloak/data

    networks:
      - keycloak-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  keycloak-data:
    driver: local

networks:
  keycloak-network:
    driver: bridge

---
# Kubernetes ExternalName Service
# Deploy this to access Keycloak from Kubernetes pods
# kubectl apply -f docker-compose-keycloak.yaml (only the Kubernetes section)
apiVersion: v1
kind: Service
metadata:
  name: keycloak-external
  namespace: production  # Or superset-sso
spec:
  type: ExternalName
  externalName: host.docker.internal
  ports:
    - port: 8090
      targetPort: 8090
      protocol: TCP
