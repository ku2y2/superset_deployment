# Development Superset Helm Values
# Simplified configuration for local development with minimal resources

# Disable external dependencies to use SQLite and SimpleCache
postgresql:
  enabled: false

redis:
  enabled: false

# Superset configuration with embedded dashboards and MySQL support
configOverrides:
  secret: |
    # Security configuration
    SECRET_KEY = 'IDR+K4GqTJGVOk7EAZGbsg1hrt6iOBO2xP7uy4wW9HBHY30ygVaYhEn'

    # Use SQLite instead of PostgreSQL for development
    SQLALCHEMY_DATABASE_URI = 'sqlite:////app/superset_home/superset.db'

    # Disable Redis cache and use simple cache
    CACHE_CONFIG = {
        'CACHE_TYPE': 'SimpleCache',
        'CACHE_DEFAULT_TIMEOUT': 300
    }
    DATA_CACHE_CONFIG = CACHE_CONFIG

    # Enable embedded dashboards
    EMBEDDED_SUPERSET = True

    # Enable public role with permissions for embedded dashboards
    PUBLIC_ROLE_LIKE = "Gamma"

    # Feature flags to enable embedding and other features
    FEATURE_FLAGS = {
        'DASHBOARD_NATIVE_FILTERS': True,
        'ENABLE_TEMPLATE_PROCESSING': False,
        'EMBEDDED_SUPERSET': True,
        'DASHBOARD_CROSS_FILTERS': True,
        'HORIZONTAL_FILTER_BAR': True,
        'SQL_VALIDATORS_BY_ENGINE': {},
    }

    # Allow iframe embedding
    TALISMAN_ENABLED = True
    TALISMAN_CONFIG = {
        'content_security_policy': None,
        'force_https': False,
    }

    # Database connectivity settings (compatible with SQLite)
    SQLALCHEMY_ENGINE_OPTIONS = {
        'pool_pre_ping': True,
    }

    # SQL Lab configuration to avoid Redis dependency
    RESULTS_BACKEND = None
    SQL_QUERY_MUTATOR = None

    # SQL Lab settings without Redis
    SQLLAB_CTAS_NO_LIMIT = True
    SQLLAB_TIMEOUT = 300
    SQLLAB_ASYNC_TIME_LIMIT_SEC = 300

    # Enable MySQL and other database drivers
    # MySQL connection format: mysql+pymysql://username:password@host:port/database_name

# Resource limits for development (minimal resources)
resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

# Single replica for dev
replicaCount: 1

# Service configuration
service:
  type: ClusterIP
  port: 8088

# Disable init containers that wait for database
init:
  enabled: false

# Remove init containers entirely
supersetNode:
  initContainers: []

# Also disable init containers for worker pods and reduce resources
supersetWorker:
  initContainers: []
  replicaCount: 1
  resources:
    limits:
      cpu: 250m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Bootstrap script to install MySQL drivers automatically
bootstrapScript: |
  #!/bin/bash
  # Install additional Python packages for database drivers
  pip install PyMySQL
  echo "PyMySQL installed successfully"

  # Create MySQLdb compatibility module
  cat > /app/.venv/lib/python3.10/site-packages/MySQLdb.py << 'EOF'
  # MySQLdb compatibility module
  import pymysql
  pymysql.install_as_MySQLdb()
  from pymysql import *
  EOF

  echo "MySQLdb compatibility module created"

# Development persistence settings
persistence:
  enabled: true
  size: 5Gi

# Disable ingress for local development
ingress:
  enabled: false

# Disable autoscaling for development
autoscaling:
  enabled: false

# Simple probes for development
livenessProbe:
  httpGet:
    path: /health
    port: 8088
  initialDelaySeconds: 60
  periodSeconds: 60
  timeoutSeconds: 10
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /health
    port: 8088
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5