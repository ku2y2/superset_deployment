# Production-ready Superset Helm Values
# Complete configuration with embedded dashboards, MySQL support, and auto-initialization

# Disable external dependencies to use SQLite and SimpleCache
postgresql:
  enabled: false

redis:
  enabled: false

# Use custom Docker image with MySQL drivers pre-installed
image:
  repository: superset-mysql
  tag: latest
  pullPolicy: Never

# Superset configuration with all features enabled
configOverrides:
  secret: |
    import os
    from flask_appbuilder.security.manager import AUTH_OAUTH

    # =====================================================
    # AUTHENTICATION TYPE - MUST BE SET FIRST
    # =====================================================
    AUTH_TYPE = AUTH_OAUTH

    # Security configuration
    SECRET_KEY = 'IDR+K4GqTJGVOk7EAZGbsg1hrt6iOBO2xP7uy4wW9HBHY30ygVaYhEn'

    # Use PostgreSQL for metadata storage
    SQLALCHEMY_DATABASE_URI = 'postgresql://superset:superset@superset-postgresql:5432/superset'

    # Disable Redis cache and use simple cache
    CACHE_CONFIG = {
        'CACHE_TYPE': 'SimpleCache',
        'CACHE_DEFAULT_TIMEOUT': 300
    }
    DATA_CACHE_CONFIG = CACHE_CONFIG

    # Enable embedded dashboards
    EMBEDDED_SUPERSET = True

    # Enable public role with permissions for embedded dashboards
    PUBLIC_ROLE_LIKE = "Gamma"

    # Feature flags to enable embedding and other features
    FEATURE_FLAGS = {
        'DASHBOARD_NATIVE_FILTERS': True,
        'ENABLE_TEMPLATE_PROCESSING': False,
        'EMBEDDED_SUPERSET': True,
        'DASHBOARD_CROSS_FILTERS': True,
        'HORIZONTAL_FILTER_BAR': True,
        'SQL_VALIDATORS_BY_ENGINE': {},
    }

    # Allow iframe embedding
    TALISMAN_ENABLED = True
    TALISMAN_CONFIG = {
        'content_security_policy': None,
        'force_https': False,
    }

    # Database connectivity settings (compatible with SQLite)
    SQLALCHEMY_ENGINE_OPTIONS = {
        'pool_pre_ping': True,
    }

    # SQL Lab configuration to avoid Redis dependency
    RESULTS_BACKEND = None
    SQL_QUERY_MUTATOR = None

    # SQL Lab settings without Redis
    SQLLAB_CTAS_NO_LIMIT = True
    SQLLAB_TIMEOUT = 300
    SQLLAB_ASYNC_TIME_LIMIT_SEC = 300

    # Enable MySQL and other database drivers
    # MySQL connection format: mysql+pymysql://username:password@host:port/database_name

    # =====================================================
    # KEYCLOAK SSO CONFIGURATION
    # =====================================================
    # Keycloak OAuth configuration
    # Client ID and Secret from Keycloak configuration
    KEYCLOAK_CLIENT_ID = "superset"
    KEYCLOAK_CLIENT_SECRET = "V5Fmab9Zs9exnQEhDXwPHeoXkawqNEBe"
    KEYCLOAK_DOMAIN = "host.docker.internal:8090"

    OAUTH_PROVIDERS = [
        {
            "name": "keycloak",
            "icon": "fa-key",
            "token_key": "access_token",
            "remote_app": {
                "client_id": KEYCLOAK_CLIENT_ID,
                "client_secret": KEYCLOAK_CLIENT_SECRET,
                "api_base_url": f"http://{KEYCLOAK_DOMAIN}/realms/master/protocol/openid-connect",
                "client_kwargs": {"scope": "email profile openid"},
                "access_token_url": f"http://{KEYCLOAK_DOMAIN}/realms/master/protocol/openid-connect/token",
                "authorize_url": f"http://localhost:8090/realms/master/protocol/openid-connect/auth",
                "request_token_url": None,
                "server_metadata_url": f"http://{KEYCLOAK_DOMAIN}/realms/master/.well-known/openid-configuration",
                "issuer": f"http://localhost:8090/realms/master",
            }
        }
