    # Map Keycloak user info to Superset user info
    AUTH_USER_REGISTRATION = True
    AUTH_USER_REGISTRATION_ROLE = "Public"

    # Custom security manager for OAuth (optional - uncomment if using custom manager)
    # from custom_sso_security_manager import CustomSsoSecurityManager
    # CUSTOM_SECURITY_MANAGER = CustomSsoSecurityManager

# Resource limits for production (adjust as needed)
resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

# Multiple replicas for high availability
replicaCount: 2

# Service configuration
service:
  type: ClusterIP
  port: 8088

# Remove init containers from nodes and workers to avoid conflicts
supersetNode:
  initContainers: []

# Also remove init containers for worker pods
supersetWorker:
  initContainers: []
  # Reduce worker replicas to save resources
  replicaCount: 1
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

# Bootstrap script to initialize Superset on startup
bootstrapScript: |
  #!/bin/bash
  # Install drivers to system location then copy to virtual environment
  pip install psycopg2-binary PyMySQL authlib
  echo "Drivers and OAuth libraries installed to system location"

  # Copy psycopg2 to virtual environment
  cp -r /usr/local/lib/python3.10/site-packages/psycopg2* /app/.venv/lib/python3.10/site-packages/ 2>/dev/null || echo "psycopg2 copy attempted"

  # Copy PyMySQL to virtual environment
  cp -r /usr/local/lib/python3.10/site-packages/pymysql* /app/.venv/lib/python3.10/site-packages/ 2>/dev/null || echo "PyMySQL copy attempted"
  cp -r /usr/local/lib/python3.10/site-packages/PyMySQL* /app/.venv/lib/python3.10/site-packages/ 2>/dev/null || echo "PyMySQL copy attempted"

  # Copy authlib for OAuth support
  cp -r /usr/local/lib/python3.10/site-packages/authlib* /app/.venv/lib/python3.10/site-packages/ 2>/dev/null || echo "authlib copy attempted"

  echo "Database drivers and OAuth libraries copied to virtual environment"

  # Create MySQLdb compatibility module
  cat > /app/.venv/lib/python3.10/site-packages/MySQLdb.py << 'EOF' || echo "MySQLdb creation attempted"
  # MySQLdb compatibility module
  import pymysql
  pymysql.install_as_MySQLdb()
  from pymysql import *
  EOF
  echo "MySQLdb compatibility module created"

# Enable built-in init job for automatic database initialization
init:
  enabled: true
  image:
    repository: superset-mysql
    tag: latest
    pullPolicy: Never
  command:
    - /bin/bash
    - -c
    - |
      echo "Starting automatic Superset initialization..."

      # Install drivers to system location then copy to virtual environment
      pip install psycopg2-binary PyMySQL authlib
      echo "Drivers and OAuth libraries installed to system location"

      # Copy psycopg2 to virtual environment
      cp -r /usr/local/lib/python3.10/site-packages/psycopg2* /app/.venv/lib/python3.10/site-packages/ 2>/dev/null || echo "psycopg2 copy attempted"

      # Copy PyMySQL to virtual environment
      cp -r /usr/local/lib/python3.10/site-packages/pymysql* /app/.venv/lib/python3.10/site-packages/ 2>/dev/null || echo "PyMySQL copy attempted"
      cp -r /usr/local/lib/python3.10/site-packages/PyMySQL* /app/.venv/lib/python3.10/site-packages/ 2>/dev/null || echo "PyMySQL copy attempted"

      # Copy authlib for OAuth support
      cp -r /usr/local/lib/python3.10/site-packages/authlib* /app/.venv/lib/python3.10/site-packages/ 2>/dev/null || echo "authlib copy attempted"

      # Create MySQLdb compatibility module
      cat > /app/.venv/lib/python3.10/site-packages/MySQLdb.py << 'EOF' || echo "MySQLdb creation attempted"
      # MySQLdb compatibility module
      import pymysql
      pymysql.install_as_MySQLdb()
      from pymysql import *
      EOF

      echo "Database drivers and OAuth libraries installed successfully"

      # Initialize database schema
      superset db upgrade
      echo "Database schema upgraded"

      # Create admin user
      superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@superset.com --password admin || true
      echo "Admin user created"

      # Initialize roles and permissions
      superset init
      echo "Superset initialization completed successfully!"

# Ingress configuration (optional - enable for external access)
ingress:
  enabled: false
  # annotations:
  #   kubernetes.io/ingress.class: nginx
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  # hosts:
  #   - host: superset.yourdomain.com
  #     paths:
  #       - path: /
  #         pathType: Prefix
  # tls:
  #   - secretName: superset-tls
  #     hosts:
  #       - superset.yourdomain.com

# No persistence needed (using PostgreSQL for metadata)
persistence:
  enabled: false

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

# Pod security context
podSecurityContext:
  fsGroup: 1000

# Horizontal Pod Autoscaler (optional)
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget for high availability
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /health
    port: 8088
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8088
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3